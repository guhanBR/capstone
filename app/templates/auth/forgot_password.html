{% extends 'base.html' %}

{% block title %}Reset Password — SparePro{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2>Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your account email address to receive reset instructions</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
