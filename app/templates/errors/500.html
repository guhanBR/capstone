{% extends 'base.html' %}

{% block title %}500 Internal Error — SparePro{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem; max-width: 600px; margin: 3rem auto;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--danger);">500 — Server Error</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">An unexpected server error occurred. Our engineering team has logged this issue.</p>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
