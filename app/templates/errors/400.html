{% extends 'base.html' %}

{% block title %}400 Bad Request — SparePro{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem; max-width: 600px; margin: 3rem auto;">
    <div style="font-size: 5rem; margin-bottom: 1rem;">❌</div>
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--warning);">400 — Bad Request</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">The server could not process your request. Please verify submitted form parameters.</p>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-primary">Return to Catalog</a>
</div>
{% endblock %}
