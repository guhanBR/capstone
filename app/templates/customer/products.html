{% extends 'base.html' %}

{% block title %}Spare Parts Catalog — SparePro{% endblock %}

{% block content %}
<!-- Page Header Title & Subtitle -->
<div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
    <div>
        <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--text-color); margin-bottom: 0.3rem;">
            Spare Parts <span style="color: var(--secondary);">Catalog</span>
        </h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Find high-quality motor and pump spare parts from trusted brands.</p>
    </div>
</div>

<!-- Search & Filter Controls -->
<form id="product-filter-form" method="GET" action="{{ url_for('products.list_products') }}" style="margin-bottom: 2rem;" onsubmit="handleFormSubmit(event)">
    <input type="hidden" name="category" id="filter-category" value="{{ current_category if current_category else '' }}">
    <input type="hidden" name="min_price" id="filter-min-price" value="{{ current_min_price if current_min_price is not none else '' }}">
    <input type="hidden" name="max_price" id="filter-max-price" value="{{ current_max_price if current_max_price is not none else '' }}">
    
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; background: var(--surface); padding: 0.75rem; border-radius: 10px; border: 1px solid var(--surface-border);">
        <input type="text" name="q" id="filter-q" class="form-control" placeholder="Search by SKU, Brand, Model, Component..." value="{{ current_search if current_search else '' }}" style="flex: 2; min-width: 250px;">
        <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.5rem; border-radius: 6px;">Search</button>

        <select id="filter-category-select" class="form-control" style="flex: 1; min-width: 140px;" onchange="syncCategorySelect(this.value)">
            <option value="">All Categories</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if current_category == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>

        <select name="brand" id="filter-brand" class="form-control" style="flex: 1; min-width: 130px;" onchange="triggerFilter(1)">
            <option value="">All Brands</option>
            {% for b in brands %}
                <option value="{{ b }}" {% if current_brand == b %}selected{% endif %}>{{ b }}</option>
            {% endfor %}
        </select>

        <select id="filter-price-range" class="form-control" style="flex: 1; min-width: 140px;" onchange="syncPriceRange(this.value)">
            <option value="">All Prices</option>
            <option value="0-100" {% if current_max_price == 100.0 and not current_min_price %}selected{% endif %}>Under ₹100</option>
            <option value="100-500" {% if current_min_price == 100.0 and current_max_price == 500.0 %}selected{% endif %}>₹100 – ₹500</option>
            <option value="500-1000" {% if current_min_price == 500.0 and current_max_price == 1000.0 %}selected{% endif %}>₹500 – ₹1,000</option>
            <option value="1000-5000" {% if current_min_price == 1000.0 and current_max_price == 5000.0 %}selected{% endif %}>₹1,000 – ₹5,000</option>
            <option value="5000-" {% if current_min_price == 5000.0 and not current_max_price %}selected{% endif %}>Above ₹5,000</option>
        </select>

        <select name="availability" id="filter-availability" class="form-control" style="flex: 1; min-width: 140px;" onchange="triggerFilter(1)">
            <option value="">All Statuses</option>
            <option value="in_stock" {% if current_availability == 'in_stock' %}selected{% endif %}>In Stock</option>
            <option value="low_stock" {% if current_availability == 'low_stock' %}selected{% endif %}>Low Stock</option>
            <option value="out_of_stock" {% if current_availability == 'out_of_stock' %}selected{% endif %}>Out of Stock</option>
        </select>

        <select name="sort" id="filter-sort" class="form-control" style="flex: 1; min-width: 150px;" onchange="triggerFilter(1)">
            <option value="newest" {% if current_sort == 'newest' %}selected{% endif %}>Newest First</option>
            <option value="oldest" {% if current_sort == 'oldest' %}selected{% endif %}>Oldest First</option>
            <option value="price_asc" {% if current_sort == 'price_asc' %}selected{% endif %}>Price: Low to High</option>
            <option value="price_desc" {% if current_sort == 'price_desc' %}selected{% endif %}>Price: High to Low</option>
            <option value="name_asc" {% if current_sort == 'name_asc' %}selected{% endif %}>Name: A to Z</option>
            <option value="name_desc" {% if current_sort == 'name_desc' %}selected{% endif %}>Name: Z to A</option>
            <option value="highest_rated" {% if current_sort == 'highest_rated' %}selected{% endif %}>Best Rated</option>
        </select>
    </div>
</form>

<!-- Main Layout: Grid Container (span full width) -->
<div style="display: block; margin-top: 1.5rem; width: 100%;">
    <!-- RIGHT MAIN PRODUCT GRID CONTAINER -->
    <div id="product-grid-container" style="position: relative; transition: opacity 0.2s ease; width: 100%;">
        {% include 'customer/_product_grid.html' %}
    </div>
</div>

<script>
// Live update filter settings & trigger AJAX
document.addEventListener('DOMContentLoaded', function() {
    // Delegation for pagination links inside #product-grid-container
    const container = document.getElementById('product-grid-container');
    if (container) {
        container.addEventListener('click', function(e) {
            const pageLink = e.target.closest('.page-link-ajax');
            if (pageLink) {
                e.preventDefault();
                const page = pageLink.getAttribute('data-page');
                triggerFilter(page);
            }
        });
    }
});

function handleFormSubmit(e) {
    e.preventDefault();
    triggerFilter(1);
}

function syncCategorySelect(catId) {
    document.getElementById('filter-category').value = catId;
    triggerFilter(1);
}

function syncPriceRange(val) {
    const parts = val.split('-');
    if (parts.length === 2) {
        document.getElementById('filter-min-price').value = parts[0] || '';
        document.getElementById('filter-max-price').value = parts[1] || '';
    } else {
        document.getElementById('filter-min-price').value = '';
        document.getElementById('filter-max-price').value = '';
    }
    triggerFilter(1);
}

function clearSingleFilter(type) {
    if (type === 'q') {
        document.getElementById('filter-q').value = '';
    } else if (type === 'category') {
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-category-select').value = '';
    } else if (type === 'brand') {
        document.getElementById('filter-brand').value = '';
    } else if (type === 'price') {
        document.getElementById('filter-min-price').value = '';
        document.getElementById('filter-max-price').value = '';
        document.getElementById('filter-price-range').value = '';
    } else if (type === 'availability') {
        document.getElementById('filter-availability').value = '';
    } else if (type === 'sort') {
        document.getElementById('filter-sort').value = 'newest';
    }
    triggerFilter(1);
}

function clearAllFilters() {
    document.getElementById('filter-q').value = '';
    document.getElementById('filter-category').value = '';
    document.getElementById('filter-category-select').value = '';
    document.getElementById('filter-brand').value = '';
    document.getElementById('filter-min-price').value = '';
    document.getElementById('filter-max-price').value = '';
    document.getElementById('filter-price-range').value = '';
    document.getElementById('filter-availability').value = '';
    document.getElementById('filter-sort').value = 'newest';
    triggerFilter(1);
}

function triggerFilter(page = 1) {
    const form = document.getElementById('product-filter-form');
    const container = document.getElementById('product-grid-container');
    if (!form || !container) return;

    const params = new URLSearchParams();

    const q = document.getElementById('filter-q').value.trim();
    if (q) params.set('q', q);

    const category = document.getElementById('filter-category').value;
    if (category) params.set('category', category);

    const brand = document.getElementById('filter-brand').value;
    if (brand) params.set('brand', brand);

    const availability = document.getElementById('filter-availability').value;
    if (availability) params.set('availability', availability);

    const sort = document.getElementById('filter-sort').value;
    if (sort && sort !== 'newest') params.set('sort', sort);

    const minPrice = document.getElementById('filter-min-price').value;
    if (minPrice) params.set('min_price', minPrice);

    const maxPrice = document.getElementById('filter-max-price').value;
    if (maxPrice) params.set('max_price', maxPrice);

    if (page && parseInt(page, 10) > 1) {
        params.set('page', page);
    }

    const newQueryString = params.toString();
    const newUrl = window.location.pathname + (newQueryString ? '?' + newQueryString : '');

    // Update URL history without page reload or jumping
    history.pushState({ path: newUrl }, '', newUrl);

    // Visual subtle loading state
    container.style.opacity = '0.5';

    const fetchUrl = newUrl + (newQueryString ? '&' : '?') + 'ajax=1';

    fetch(fetchUrl, {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.text())
    .then(html => {
        container.innerHTML = html;
        container.style.opacity = '1';
    })
    .catch(err => {
        console.error('Failed to fetch filtered products:', err);
        container.style.opacity = '1';
    });
}

// Handle Browser Back / Forward buttons cleanly
window.addEventListener('popstate', function(e) {
    const urlParams = new URLSearchParams(window.location.search);
    
    document.getElementById('filter-q').value = urlParams.get('q') || '';
    
    const cat = urlParams.get('category') || '';
    document.getElementById('filter-category').value = cat;
    document.getElementById('filter-category-select').value = cat;
    
    document.getElementById('filter-brand').value = urlParams.get('brand') || '';
    
    const avail = urlParams.get('availability') || '';
    document.getElementById('filter-availability').value = avail;

    document.getElementById('filter-sort').value = urlParams.get('sort') || 'newest';

    const minPrice = urlParams.get('min_price') || '';
    const maxPrice = urlParams.get('max_price') || '';
    document.getElementById('filter-min-price').value = minPrice;
    document.getElementById('filter-max-price').value = maxPrice;

    const select = document.getElementById('filter-price-range');
    if (select) {
        if (minPrice === '' && maxPrice === '') {
            select.value = '';
        } else if (minPrice === '' && parseFloat(maxPrice) === 100) {
            select.value = '0-100';
        } else if (parseFloat(minPrice) === 100 && parseFloat(maxPrice) === 500) {
            select.value = '100-500';
        } else if (parseFloat(minPrice) === 500 && parseFloat(maxPrice) === 1000) {
            select.value = '500-1000';
        } else if (parseFloat(minPrice) === 1000 && parseFloat(maxPrice) === 5000) {
            select.value = '1000-5000';
        } else if (parseFloat(minPrice) === 5000 && maxPrice === '') {
            select.value = '5000-';
        } else {
            select.value = '';
        }
    }

    // Fetch product grid for popped state
    const container = document.getElementById('product-grid-container');
    if (container) {
        container.style.opacity = '0.5';
        const fetchUrl = window.location.pathname + window.location.search + (window.location.search ? '&' : '?') + 'ajax=1';
        fetch(fetchUrl, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.text())
        .then(html => {
            container.innerHTML = html;
            container.style.opacity = '1';
        })
        .catch(() => { container.style.opacity = '1'; });
    }
});
</script>
{% endblock %}
