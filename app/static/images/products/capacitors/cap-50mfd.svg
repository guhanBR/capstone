<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_119" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#372d5f"/>
      <stop offset="100%" stop-color="#1a1042"/>
    </radialGradient>
    <filter id="glow_119">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_119)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_119" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ab47bc" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_119)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#ab47bc"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#ab47bc" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#ab47bc" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_119)">
    
        <rect x="55" y="30" width="50" height="80" rx="8" fill="#1a1a50" stroke="#ab47bc" stroke-width="4"/>
        <rect x="63" y="38" width="34" height="64" rx="4" fill="#2a2060"/>
        <line x1="80" y1="110" x2="80" y2="130" stroke="#ab47bc" stroke-width="5"/>
        <line x1="72" y1="130" x2="88" y2="130" stroke="#ab47bc" stroke-width="4"/>
        <text x="80" y="75" text-anchor="middle" fill="#ab47bc" font-size="12" font-weight="bold">MFD</text>
        <text x="80" y="92" text-anchor="middle" fill="#ce93d8" font-size="10">440V</text>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#ab47bc" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#ab47bc" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#f3e5f5" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">50 MFD Run Capacitor</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#ab47bc" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">50MFD</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#f3e5f5" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">440VAC | 2HP Pump</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#ab47bc" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#ab47bc"/>
</svg>