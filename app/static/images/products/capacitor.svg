<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' width='100%' height='100%'>
  <defs>
    <linearGradient id='canGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#64748b'/>
      <stop offset='30%' stop-color='#f8fafc'/>
      <stop offset='70%' stop-color='#cbd5e1'/>
      <stop offset='100%' stop-color='#475569'/>
    </linearGradient>
    <filter id='shadow'>
      <feDropShadow dx='0' dy='8' stdDeviation='8' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='#181c24' rx='16'/>
  <g transform='translate(200, 155)' filter='url(#shadow)'>
    <!-- Can Body -->
    <rect x='-55' y='-60' width='110' height='140' rx='16' fill='url(#canGrad)' stroke='#94a3b8' stroke-width='2'/>
    <!-- Top Cap Header -->
    <rect x='-50' y='-75' width='100' height='18' rx='4' fill='#1e293b'/>
    
    <!-- Terminals -->
    <rect x='-30' y='-95' width='14' height='22' rx='2' fill='url(#canGrad)' stroke='#334155'/>
    <rect x='-30' y='-102' width='14' height='8' rx='1' fill='#e2e8f0'/>
    <rect x='16' y='-95' width='14' height='22' rx='2' fill='url(#canGrad)' stroke='#334155'/>
    <rect x='16' y='-102' width='14' height='8' rx='1' fill='#e2e8f0'/>
    
    <!-- Label -->
    <rect x='-42' y='-35' width='84' height='75' rx='6' fill='#0f172a'/>
    <text x='0' y='-15' font-family='sans-serif' font-size='11' font-weight='bold' fill='#38bdf8' text-anchor='middle'>SPAREPRO</text>
    <text x='0' y='5' font-family='sans-serif' font-size='16' font-weight='bold' fill='#f97316' text-anchor='middle'>50 MFD</text>
    <text x='0' y='22' font-family='sans-serif' font-size='9' fill='#94a3b8' text-anchor='middle'>450 VAC  50/60Hz</text>
  </g>
</svg>