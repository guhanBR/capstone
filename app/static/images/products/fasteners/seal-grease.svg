<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_139" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2d2513"/>
      <stop offset="100%" stop-color="#1a1200"/>
    </radialGradient>
    <filter id="glow_139">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_139)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_139" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8d6e63" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_139)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#8d6e63"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#8d6e63" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#8d6e63" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_139)">
    
        <polygon points="80,30 95,55 125,55 100,72 110,100 80,82 50,100 60,72 35,55 65,55" fill="none" stroke="#8d6e63" stroke-width="4"/>
        <circle cx="80" cy="80" r="15" fill="none" stroke="#8d6e63" stroke-width="3"/>
        <circle cx="80" cy="80" r="5" fill="#8d6e63"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#8d6e63" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#8d6e63" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#efebe9" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">Mechanical Seal Lubr…</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#8d6e63" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">LUB-100</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#efebe9" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">100g | -40°C to 200°C</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#8d6e63" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#8d6e63"/>
</svg>