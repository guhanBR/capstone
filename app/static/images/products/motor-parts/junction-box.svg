<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_44" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#28200e"/>
      <stop offset="100%" stop-color="#1a1200"/>
    </radialGradient>
    <filter id="glow_44">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_44)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_44" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffa726" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_44)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#ffa726"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#ffa726" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#ffa726" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_44)">
    
        <ellipse cx="80" cy="80" rx="48" ry="32" fill="none" stroke="#ffa726" stroke-width="4"/>
        <ellipse cx="80" cy="80" rx="36" ry="20" fill="none" stroke="#ffa726" stroke-width="3"/>
        <line x1="80" y1="48" x2="80" y2="112" stroke="#ffa726" stroke-width="3"/>
        <line x1="44" y1="65" x2="116" y2="95" stroke="#ffa726" stroke-width="2"/>
        <line x1="44" y1="95" x2="116" y2="65" stroke="#ffa726" stroke-width="2"/>
        <circle cx="80" cy="80" r="8" fill="#ffa726"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#ffa726" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#ffa726" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#fff3e0" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">Motor Junction Box</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#ffa726" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">JBC-01</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#fff3e0" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">IP55 | IEC 90/100</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#ffa726" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#ffa726"/>
</svg>