<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_134" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b2938"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </radialGradient>
    <filter id="glow_134">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_134)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_134" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4fc3f7" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_134)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#4fc3f7"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#4fc3f7" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#4fc3f7" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_134)">
    
        <circle cx="80" cy="80" r="45" fill="none" stroke="#4fc3f7" stroke-width="6"/>
        <circle cx="80" cy="80" r="28" fill="none" stroke="#4fc3f7" stroke-width="4"/>
        <circle cx="80" cy="43" r="7" fill="#4fc3f7"/>
        <circle cx="80" cy="117" r="7" fill="#4fc3f7"/>
        <circle cx="43" cy="80" r="7" fill="#4fc3f7"/>
        <circle cx="117" cy="80" r="7" fill="#4fc3f7"/>
        <circle cx="54" cy="54" r="7" fill="#4fc3f7"/>
        <circle cx="106" cy="106" r="7" fill="#4fc3f7"/>
        <circle cx="106" cy="54" r="7" fill="#4fc3f7"/>
        <circle cx="54" cy="106" r="7" fill="#4fc3f7"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#4fc3f7" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#e0f7fa" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">6306 High Speed Bear…</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#4fc3f7" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">6306</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#e0f7fa" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">ID:30mm OD:72mm | 7.5HP</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#4fc3f7" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#4fc3f7"/>
</svg>