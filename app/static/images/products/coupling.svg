<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' width='100%' height='100%'>
  <defs>
    <linearGradient id='jawGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#64748b'/>
      <stop offset='50%' stop-color='#e2e8f0'/>
      <stop offset='100%' stop-color='#334155'/>
    </linearGradient>
    <filter id='shadow'>
      <feDropShadow dx='0' dy='8' stdDeviation='8' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='#181c24' rx='16'/>
  <g transform='translate(200, 150)' filter='url(#shadow)'>
    <!-- Left Hub -->
    <rect x='-110' y='-50' width='60' height='100' rx='8' fill='url(#jawGrad)' stroke='#475569'/>
    <rect x='-120' y='-25' width='20' height='50' fill='#1e293b'/>
    
    <!-- Red Spider Insert in Middle -->
    <rect x='-50' y='-45' width='30' height='90' rx='6' fill='#ef4444' stroke='#dc2626' stroke-width='2'/>
    <circle cx='-35' cy='0' r='12' fill='#991b1b'/>

    <!-- Right Hub -->
    <rect x='-20' y='-50' width='60' height='100' rx='8' fill='url(#jawGrad)' stroke='#475569'/>
    <rect x='40' y='-25' width='20' height='50' fill='#1e293b'/>
  </g>
</svg>