<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_79" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#202d3e"/>
      <stop offset="100%" stop-color="#0d1a2b"/>
    </radialGradient>
    <filter id="glow_79">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_79)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_79" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#42a5f5" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_79)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#42a5f5"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#42a5f5" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#42a5f5" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_79)">
    
        <rect x="25" y="65" width="35" height="30" rx="5" fill="#1a3a60" stroke="#42a5f5" stroke-width="3"/>
        <rect x="100" y="65" width="35" height="30" rx="5" fill="#1a3a60" stroke="#42a5f5" stroke-width="3"/>
        <path d="M60 75 C70 68 90 68 100 75" stroke="#42a5f5" stroke-width="4" fill="none"/>
        <path d="M60 85 C70 92 90 92 100 85" stroke="#42a5f5" stroke-width="4" fill="none"/>
        <circle cx="80" cy="80" r="8" fill="#42a5f5" opacity="0.5"/>
        <rect x="58" y="70" width="44" height="20" rx="10" fill="#42a5f5" opacity="0.15" stroke="#42a5f5" stroke-width="2"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#42a5f5" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#42a5f5" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#e3f2fd" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">L-095 Spider Insert</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#42a5f5" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">L-095-SP</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#e3f2fd" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">NBR Rubber | Flexible</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#42a5f5" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#42a5f5"/>
</svg>