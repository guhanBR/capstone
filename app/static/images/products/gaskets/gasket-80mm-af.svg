<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_114" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#322543"/>
      <stop offset="100%" stop-color="#1a0d2b"/>
    </radialGradient>
    <filter id="glow_114">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_114)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_114" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7e57c2" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_114)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#7e57c2"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#7e57c2" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#7e57c2" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_114)">
    
        <circle cx="80" cy="80" r="48" fill="none" stroke="#7e57c2" stroke-width="5"/>
        <circle cx="80" cy="80" r="38" fill="none" stroke="#7e57c2" stroke-width="2" stroke-dasharray="6,4"/>
        <circle cx="80" cy="80" r="20" fill="none" stroke="#7e57c2" stroke-width="4"/>
        <circle cx="80" cy="32" r="5" fill="#7e57c2"/>
        <circle cx="80" cy="128" r="5" fill="#7e57c2"/>
        <circle cx="32" cy="80" r="5" fill="#7e57c2"/>
        <circle cx="128" cy="80" r="5" fill="#7e57c2"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#7e57c2" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#7e57c2" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#ede7f6" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">80mm Asbestos-Free G…</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#7e57c2" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">AF-80</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#ede7f6" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">3 inch | 150 PSI</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#7e57c2" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#7e57c2"/>
</svg>