<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_19" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2d2020"/>
      <stop offset="100%" stop-color="#1a0d0d"/>
    </radialGradient>
    <filter id="glow_19">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_19)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_19" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ef5350" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_19)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#ef5350"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#ef5350" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#ef5350" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_19)">
    
        <rect x="30" y="74" width="100" height="12" rx="4" fill="#ef5350"/>
        <rect x="30" y="68" width="12" height="24" rx="2" fill="#c62828"/>
        <rect x="118" y="68" width="12" height="24" rx="2" fill="#c62828"/>
        <rect x="50" y="70" width="60" height="20" rx="2" fill="#b71c1c" opacity="0.4"/>
        <circle cx="80" cy="80" r="8" fill="none" stroke="#ef5350" stroke-width="3"/>
        <line x1="80" y1="30" x2="80" y2="50" stroke="#ef9a9a" stroke-width="2" stroke-dasharray="3,3"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#ef5350" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#ef5350" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#ffebee" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">16mm SS-304 Pump Shaft</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#ef5350" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">SFT-16</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#ffebee" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">Dia:16mm L:350mm</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#ef5350" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#ef5350"/>
</svg>