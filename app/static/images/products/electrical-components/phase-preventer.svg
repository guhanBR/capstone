<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_126" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#062020"/>
      <stop offset="100%" stop-color="#001a1a"/>
    </radialGradient>
    <filter id="glow_126">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg_126)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid_126" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#26a69a" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid_126)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="400" height="4" fill="#26a69a"/>
  
  <!-- Icon area with circle backdrop -->
  <circle cx="200" cy="155" r="90" fill="#26a69a" opacity="0.08"/>
  <circle cx="200" cy="155" r="75" fill="#26a69a" opacity="0.06"/>
  
  <!-- Category icon (scaled to center) -->
  <g transform="translate(120, 75) scale(1.0)" filter="url(#glow_126)">
    
        <rect x="40" y="45" width="80" height="70" rx="6" fill="#003333" stroke="#26a69a" stroke-width="4"/>
        <rect x="50" y="58" width="20" height="30" rx="3" fill="#26a69a" opacity="0.6"/>
        <rect x="75" y="58" width="20" height="30" rx="3" fill="#26a69a" opacity="0.6"/>
        <rect x="100" y="58" width="20" height="30" rx="3" fill="#26a69a" opacity="0.6"/>
        <line x1="55" y1="45" x2="55" y2="35" stroke="#26a69a" stroke-width="3"/>
        <line x1="80" y1="45" x2="80" y2="35" stroke="#26a69a" stroke-width="3"/>
        <line x1="105" y1="45" x2="105" y2="35" stroke="#26a69a" stroke-width="3"/>
        <line x1="55" y1="115" x2="55" y2="125" stroke="#26a69a" stroke-width="3"/>
        <line x1="80" y1="115" x2="80" y2="125" stroke="#26a69a" stroke-width="3"/>
        <line x1="105" y1="115" x2="105" y2="125" stroke="#26a69a" stroke-width="3"/>
    
  </g>
  
  <!-- Bottom info panel -->
  <rect x="0" y="280" width="400" height="120" fill="#26a69a" opacity="0.12"/>
  <line x1="20" y1="284" x2="380" y2="284" stroke="#26a69a" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Product name -->
  <text x="200" y="318" text-anchor="middle" fill="#e0f2f1" 
        font-family="Arial, sans-serif" font-size="18" font-weight="700">Phase Preventer Relay</text>
  
  <!-- Model number -->
  <text x="200" y="343" text-anchor="middle" fill="#26a69a" 
        font-family="Arial, sans-serif" font-size="14" font-weight="600">SPP-01</text>
  
  <!-- Spec line -->
  <text x="200" y="365" text-anchor="middle" fill="#e0f2f1" 
        font-family="Arial, sans-serif" font-size="11" opacity="0.7">415V 3-Phase | Auto Re…</text>
  
  <!-- Brand badge area -->
  <rect x="160" y="378" width="80" height="16" rx="8" fill="#26a69a" opacity="0.3"/>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="396" width="400" height="4" fill="#26a69a"/>
</svg>