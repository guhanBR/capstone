<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' width='100%' height='100%'>
  <defs>
    <linearGradient id='switchGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#10b981'/>
      <stop offset='100%' stop-color='#047857'/>
    </linearGradient>
    <filter id='shadow'>
      <feDropShadow dx='0' dy='8' stdDeviation='8' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='#181c24' rx='16'/>
  <g transform='translate(200, 150)' filter='url(#shadow)'>
    <!-- Switch Box Housing -->
    <rect x='-75' y='-85' width='150' height='170' rx='16' fill='#1e293b' stroke='#334155' stroke-width='3'/>
    
    <!-- Start Button -->
    <circle cx='0' cy='-35' r='28' fill='url(#switchGrad)' stroke='#6ee7b7' stroke-width='3'/>
    <text x='0' y='-30' font-family='sans-serif' font-size='12' font-weight='bold' fill='#ffffff' text-anchor='middle'>START</text>
    
    <!-- Stop Button -->
    <circle cx='0' cy='40' r='24' fill='#ef4444' stroke='#fca5a5' stroke-width='3'/>
    <text x='0' y='44' font-family='sans-serif' font-size='11' font-weight='bold' fill='#ffffff' text-anchor='middle'>STOP</text>
  </g>
</svg>