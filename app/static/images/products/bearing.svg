<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' width='100%' height='100%'>
  <defs>
    <linearGradient id='metal1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#3a404d'/>
      <stop offset='50%' stop-color='#1f242d'/>
      <stop offset='100%' stop-color='#0f1217'/>
    </linearGradient>
    <linearGradient id='steel' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#e2e8f0'/>
      <stop offset='30%' stop-color='#94a3b8'/>
      <stop offset='70%' stop-color='#cbd5e1'/>
      <stop offset='100%' stop-color='#64748b'/>
    </linearGradient>
    <linearGradient id='ball' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='40%' stop-color='#cbd5e1'/>
      <stop offset='100%' stop-color='#334155'/>
    </linearGradient>
    <filter id='drop' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='8' stdDeviation='6' flood-color='#000000' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='#181c24' rx='16'/>
  <g transform='translate(200, 150)' filter='url(#drop)'>
    <!-- Outer Ring -->
    <circle r='105' fill='url(#steel)' stroke='#475569' stroke-width='3'/>
    <circle r='85' fill='url(#metal1)'/>
    
    <!-- Cage & Race -->
    <circle r='73' fill='none' stroke='#334155' stroke-width='2' stroke-dasharray='4,4'/>
    
    <!-- Rolling Balls -->
    <circle cx='0' cy='-73' r='14' fill='url(#ball)'/>
    <circle cx='51.6' cy='-51.6' r='14' fill='url(#ball)'/>
    <circle cx='73' cy='0' r='14' fill='url(#ball)'/>
    <circle cx='51.6' cy='51.6' r='14' fill='url(#ball)'/>
    <circle cx='0' cy='73' r='14' fill='url(#ball)'/>
    <circle cx='-51.6' cy='51.6' r='14' fill='url(#ball)'/>
    <circle cx='-73' cy='0' r='14' fill='url(#ball)'/>
    <circle cx='-51.6' cy='-51.6' r='14' fill='url(#ball)'/>
    
    <!-- Inner Ring -->
    <circle r='60' fill='url(#metal1)' stroke='#475569' stroke-width='2'/>
    <circle r='42' fill='url(#steel)' stroke='#334155' stroke-width='2'/>
    <!-- Center Bore -->
    <circle r='28' fill='#181c24'/>
  </g>
</svg>